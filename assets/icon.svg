<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7c5cff"/>
      <stop offset="0.55" stop-color="#6a3df0"/>
      <stop offset="1" stop-color="#4b23c7"/>
    </linearGradient>
    <linearGradient id="screen" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1b1140"/>
      <stop offset="1" stop-color="#120b2e"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="16" flood-color="#2a106b" flood-opacity="0.45"/>
    </filter>
  </defs>

  <!-- app badge -->
  <rect x="24" y="24" width="464" height="464" rx="108" fill="url(#bg)"/>
  <!-- subtle top sheen -->
  <rect x="24" y="24" width="464" height="232" rx="108" fill="#ffffff" opacity="0.08"/>

  <!-- chat bubble housing the terminal -->
  <g filter="url(#soft)">
    <path d="M136 132
             h240 a44 44 0 0 1 44 44
             v150 a44 44 0 0 1 -44 44
             h-150 l-70 60 v-60 h-20
             a44 44 0 0 1 -44 -44
             v-150 a44 44 0 0 1 44 -44 z"
          fill="url(#screen)" stroke="#ffffff" stroke-opacity="0.14" stroke-width="3"/>
  </g>

  <!-- terminal title dots -->
  <circle cx="176" cy="178" r="11" fill="#ff6b6b"/>
  <circle cx="214" cy="178" r="11" fill="#ffd166"/>
  <circle cx="252" cy="178" r="11" fill="#4cd964"/>

  <!-- prompt chevron -->
  <path d="M168 232 l44 36 -44 36"
        fill="none" stroke="#9affc8" stroke-width="20"
        stroke-linecap="round" stroke-linejoin="round"/>
  <!-- cursor / command line -->
  <rect x="228" y="288" width="128" height="20" rx="10" fill="#ffffff" opacity="0.92"/>
</svg>
